[package]
name = "pill_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = {path = "../pill_core"}

# Errors
thiserror = "1.0.30"

# Loggers
log = { version = "0.4", features = ["release_max_level_off"] }

# Loaders
tobj = { version = "3.0", optional = true }
# Runtime glTF loading (feature `gltf_loading`): parse glTF + decode embedded/fetched textures.
# The shared vertex/format/bake math comes from pill_assets (default-features off → its pure,
# wasm-safe `convert`/`ibl` modules only, no filesystem pipeline). Parsing uses goth-gltf
# (nanoserde-based) not the gltf crate (serde_json) — that swap saved ~150 KB of wasm. Textures
# decode with the lean `zune-*` codecs (vs the full `image` crate, another ~110 KB).
goth-gltf = { version = "0.3", optional = true }
zune-jpeg = { version = "0.4", default-features = false, optional = true }
zune-png = { version = "0.4", default-features = false, optional = true }
pill_assets = { path = "../pill_assets", default-features = false, optional = true }

# Other
readonly = "0.2"
winit = "0.30.12"
bytemuck = { version = "1.4", features = [ "derive" ] }
half = "2"
lazy_static = "1.4.0"
dyn-clone = "1.0.4"
wgpu = "25.0.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.0"
once_cell = "1.21.3"
bitvec = "1.0.1"
rand = "0.9.2"
web-time = "1.1"
rapier3d = { version = "0.32.0", optional = true }

# Optional deps activated by feature flags
egui = { version = "0.32.1", optional = true }
egui-wgpu = { version = "0.32.1", features = ["winit"], optional = true }
egui-winit = { version = "0.32.1", default-features = false, optional = true }

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"
rodio = { version = "0.20", features = ["wav", "mp3"] }
gilrs = "0.11.0"
pollster = "0.2"
# clipboard pulls arboard, which has no wasm32 backend — desktop only (powers the egui [C] copy button)
egui-winit = { version = "0.32.1", default-features = false, features = ["clipboard"], optional = true }


[build-dependencies]
fs_extra = "1.2"
pill_assets = { path = "../pill_assets" }

[features]
game = []
internal = []
headless = []
networking = []
physics = ["dep:rapier3d"]
ui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
obj_loading = ["dep:tobj"]
# Runtime multi-file/embedded glTF loading into engine byte formats (RMSH meshes, RTEX textures).
gltf_loading = ["dep:goth-gltf", "dep:zune-jpeg", "dep:zune-png", "dep:pill_assets"]
# Runtime IBL bake (equirect → diffuse/specular), shared with the build-time cooker.
ibl_bake = ["dep:pill_assets"]
# Embedded PPAK asset pack (`Engine::mount_asset_pack`); path-based resources load from it first.
asset_pack = ["dep:pill_assets"]
all = ["game", "internal", "networking"]
