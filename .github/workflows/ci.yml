# Fast per-commit checks: every feature posture compiles, the unit tests run,
# the comment/layout lint passes, and rustdoc's intra-doc links resolve.
#
# The heavy end-to-end lanes (hot reload, benchmarks) run on a schedule in
# nightly.yml instead: they drive real host processes and real builds.
#
# Every command lives in devops/ci_cd/verify.py, the one list CI and
# AGENTS.md share. CI runs the script once, so a step added there runs here
# with no edit to this file. `python devops/ci_cd/verify.py --list` prints the
# steps, and a local run of the script executes the same commands.
name: CI

on:
  # Automatic triggers are disabled for now; uncomment them to re-enable CI.
  # The workflow still runs manually from the Actions tab.
  push:
    branches:
      - main
      - golden
  pull_request:
    branches:
      - main
      - golden
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SLANG_VERSION: v2025.24

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slang_asset: '*-windows-x86_64.zip'
          - os: ubuntu-latest
            slang_asset: '*-linux-x86_64.zip'
          - os: macos-latest
            slang_asset: '*-macos-aarch64.zip'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules
      - name: Install cargo-nextest
        # verify.py runs the Rust test lanes through nextest when it is
        # installed (per-test processes and per-test times) and falls back to
        # `cargo test` when it is not, so CI installs it rather than letting
        # the fallback quietly become the CI lane.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install system dependencies
        if: runner.os == 'Linux'  # the only OS-specific step
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install slangc
        env:
          GH_TOKEN: ${{ github.token }}
          SLANG_ASSET: ${{ matrix.slang_asset }}
        run: |
          download="$RUNNER_TEMP/slang-download"
          dest="$RUNNER_TOOL_CACHE/slang"
          gh release download "$SLANG_VERSION" --repo shader-slang/slang \
            --pattern "$SLANG_ASSET" --dir "$download"
          archive=$(ls "$download"/*.zip | head -n 1)
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -y "$archive" -o"$dest" >/dev/null
          else
            unzip -q "$archive" -d "$dest"
          fi
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Verify slangc
        run: slangc -v

      - name: Install cargo-about
        # The `licenses` step checks every dependency's license against
        # modules/about.toml, and shipping builds write their notices with it.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install pyyaml pillow

      - name: verify.py (quick)
        # One step runs the whole gate, so CI cannot drift from the list.
        # verify.py prints each check as a collapsible log group and writes
        # its PASS/FAIL table to the job summary; --keep-going reports every
        # failing check, not only the first.
        run: python devops/ci_cd/verify.py --keep-going --quick

