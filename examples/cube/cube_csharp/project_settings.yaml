# The cube, managed: the same scene and the same files as `cube_rust`.
#
# The build outputs of the two projects share names on disk, so each keeps its
# own `res`. The rendering data crate is listed because managed code names the
# components it carries; the renderer draws them.

name: "Cube (C#)"
build_binary_name: "CubeCsharp"
version: "0.1.0"
description: "A spinning cube whose mesh and material are files under res, in C#."

modules:
  pill_rendering:
    enabled: true
  pill_renderer:
    enabled: true

editor:
  theme: "editor/editor.theme"
