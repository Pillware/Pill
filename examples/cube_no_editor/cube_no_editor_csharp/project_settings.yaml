# The cube with no `.meta`, managed: the same imports and the same build of
# the renderer's builder as the Rust twin.

name: "Cube (No Editor, C#)"
build_binary_name: "CubeNoEditorCsharp"
version: "0.1.0"
description: "A spinning cube from one OBJ file with no metadata, in C#."

modules:
  pill_rendering:
    enabled: true
  pill_renderer:
    enabled: true
