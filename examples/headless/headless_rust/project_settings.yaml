# A pure simulation: no renderer, no assets, no window.
#
# No module is listed, and an entry nobody lists is off, so a run opens no
# device and draws nothing. The same project runs in the headless host and in
# a windowed one.

name: "Headless"
build_binary_name: "HeadlessRust"
version: "0.1.0"
description: "An ECS-only simulation with no renderer, no assets and no window."

modules: {}
