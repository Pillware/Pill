[package]
name = "pill_game"
version = "0.1.0"
edition = "2021"
workspace = "NO_PATH"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
ureq = "2"
# `encode`: writes the release/wasm asset pack (`write_pack_for_build`)
pill_assets = { path = "../../engine/pill_assets", features = ["encode"] }

[dependencies]
pill_engine = { path = "../../engine/pill_engine", features = ["game", "internal", "asset_pack", "post_fx"] }
