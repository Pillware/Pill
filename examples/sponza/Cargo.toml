[package]
name = "pill_game"
version = "0.1.0"
edition = "2021"
workspace = "NO_PATH"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `gltf_loading` pulls the engine's runtime glTF loader + IBL bake (gltf + image decode) into this
# build. Everything model/IBL related lives in the engine/pill_assets now — nothing example-side.
pill_engine = { path = "../../engine/pill_engine", features = ["game", "internal", "gltf_loading", "ibl_bake"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "RequestMode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"
pollster = "0.2"
