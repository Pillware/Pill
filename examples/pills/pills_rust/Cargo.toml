[package]
name = "pills_rust"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for a hot-reloading build, where the host loads this as a DLL.
# `rlib` so a shipping or web build can link the project straight into the
# binary - a cdylib cannot be a Rust library dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.33"
pill_engine = { path = "../../../modules/engine/pill_engine" }
# The math vocabulary the engine and the UI share (positions, sizes).
pill_core = { path = "../../../modules/engine/pill_core" }
# The in-game UI: the tuning overlay builds an egui pass with it, and the
# renderer draws the frame it publishes through `pill_ui_frame`'s slot. A
# shared library, so the overlay's context - its fonts, its widget state -
# outlives a reload of this project.
pill_project_ui = { path = "../../../modules/ui/pill_project_ui" }
# The master renderer's data only - components, assets, pipelines. The GPU
# renderer is the host's. `default-features = false`, as for every extension,
# keeps its module exports out of this project's DLL.
pill_rendering = { path = "../../../modules/extensions/rendering/pill_rendering_core/modules/runtime/data", default-features = false }
serde = { version = "1", features = ["derive"] }
