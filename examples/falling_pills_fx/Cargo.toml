[package]
name = "pill_game"
version = "0.1.0"
edition = "2021"
workspace = "NO_PATH"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
# Studio IBL baked at build time (build.rs)
pill_assets = { path = "../../engine/pill_assets" }

[dependencies]
pill_engine = { path = "../../engine/pill_engine", features = ["game", "post_fx"] }
