# The audio example, managed: a sound, a listener and a source that plays it.
#
# The rendering data crate is listed alone here, without the GPU renderer: a C#
# project cannot register a component, and the data crate is what provides
# `TransformComponent` to managed code. No renderer means no device and no
# window, so nothing draws.

name: "Audio Scene (C#)"
build_binary_name: "AudioSceneCSharp"
version: "0.1.0"
description: "The managed twin of the audio example: a sound, a listener and a playing source."

modules:
  pill_rendering:
    enabled: true
  pill_audio:
    enabled: true
