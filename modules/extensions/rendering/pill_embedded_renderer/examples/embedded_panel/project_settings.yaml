name: "Embedded Panel Example"
build_binary_name: "EmbeddedPanelExample"
version: "0.1.0"
author: "Matt Szymon"
description: "A textured quad, a light, a UI panel and debug lines, drawn by the processor renderer on a 240x240 panel."

# The renderer this project is proved with. It draws on the processor into an
# RGB565 panel instead of onto a GPU surface, which is why a preview shows a
# 240x240 frame enlarged into the window.
renderer: "pill_embedded_renderer"

# Nothing else to load: the renderer's data crate comes with the renderer.
modules: []
