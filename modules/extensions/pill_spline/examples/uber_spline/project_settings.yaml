name: "Uber Spline Example"
build_binary_name: "UberSplineExample"
version: "0.1.0"
author: "Matt Szymonski"
description: "A spline path edited by the spline tool, with room for an extension's roll handles."

# The runtime crate the editor tools edit. The editor-only parts - the spline
# tool and the roll extension - are loaded by an editor host and never listed
# here, because a game build does not build them.
modules:
  - "pill_spline"

logging:
  targets:
    project: debug
