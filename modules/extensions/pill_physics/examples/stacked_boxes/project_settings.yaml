# The physics example: a stack of boxes falling onto a fixed ground plane.
#
# No renderer is listed, so the example opens no window. The simulation runs the
# same headless and windowed; only the drawing of it needs a renderer.

name: "Stacked Boxes"
build_binary_name: "StackedBoxesRust"
version: "0.1.0"
description: "A ground plane and a stack of dynamic boxes simulated by pill_physics."

modules:
  pill_physics:
    enabled: true
