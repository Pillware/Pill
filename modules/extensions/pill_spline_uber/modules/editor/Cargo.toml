[package]
name = "pill_spline_uber_editor"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# The crate's build script emits the function-address inventory the host uses
# to patch any function, annotated or not.
[build-dependencies]
pill_hot_scan = { path = "../../../../hosting/pill_hot_scan" }

[lib]
# Named after the crate rather than `lib.rs`, like every extension crate.
path = "src/pill_spline_uber_editor.rs"
# `rlib` only: the artifact an editor host loads is built by the generated
# `host_module_pill_spline_uber_editor` wrapper in this folder's `generated/`.
crate-type = ["rlib"]

# The semi-inheritance proving case: an editor-only crate that adds a roll
# handle and a menu row to the spline tool it does not own. The folder holds
# only this crate, so an editor host loads it unconditionally and no game
# build ever builds it.
[dependencies]
pill_core = { path = "../../../../engine/pill_core" }
pill_engine = { path = "../../../../engine/pill_engine" }
pill_editor_core = { path = "../../../../editor/pill_editor_core" }
pill_spline = { path = "../../../pill_spline/modules/runtime", default-features = false }
# The component's field layout is persisted, so its fields carry serde.
serde = { version = "1", features = ["derive"] }

# The base tool, for the tests that prove the cross-crate chain: the extension
# is attached to the tool the other crate registers, not to a stand-in.
[dev-dependencies]
pill_spline_editor = { path = "../../../pill_spline/modules/editor" }
