# Project settings for the managed test project.
#
# One project carries what the C# suites need: the bridge surface (components, a
# resource, systems, asset imports), the extension mirrors the bridge asserts,
# and the iteration benchmark's three query shapes, which stay silent unless
# PILL_BENCH_ENTITIES names an entity count.
#
# `name` is the display name (window title); `build_binary_name` is the artifact
# file base and must contain only letters, digits and underscores. Both are
# required. The rendering data crate is listed without its renderer: the managed
# code names the components it carries, and a headless run needs no device.

name: "Managed Test Project"
build_binary_name: "ManagedTestProject"
version: "0.1.0"
author: "Matt Szymonski"
description: "The C# test project: bridge surface, extension mirrors and the gated iteration benchmark."

modules:
  pill_rendering:
    enabled: true
  pill_spline:
    enabled: true
  pill_test:
    enabled: true
