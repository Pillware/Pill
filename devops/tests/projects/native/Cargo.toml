[package]
name = "native"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for a hot-reloading build, where the host loads this as a DLL.
# `rlib` so a shipping build can link the project straight into the binary -
# a cdylib cannot be a Rust library dependency. Every extension already
# carries both for the same reason.
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_engine = { path = "../../../../modules/engine/pill_engine" }
pill_core = { path = "../../../../modules/engine/pill_core" }
# The master renderer's data only - components, assets, pipelines. The GPU
# renderer is the host's; a project that linked it would carry wgpu in its own
# DLL. `default-features = false` documents that this edge chooses its
# features explicitly (the crate declares no defaults today).
pill_rendering = { path = "../../../../modules/extensions/rendering/pill_rendering_core/modules/runtime/data", default-features = false }
# The component gizmos this project declares draw through the renderer
# contract.
pill_renderer_api = { path = "../../../../modules/rendering/pill_renderer_api" }
# Linked directly so the project can name the `Spline` type. See the note in
# `init` about why this crate must not also be loaded as a module.
# `default-features = false` is a defensive no-op: the crate declares no
# defaults, and the feature list below is the explicit choice.
# `test-hooks` keeps the module's demo observables - the sampled height
# offset, the `GetSum` shift - that the hot-reload and bridge suites edit and
# watch for; a default build of the module computes only the documented math.
pill_spline = { path = "../../../../modules/extensions/pill_spline/modules/runtime", default-features = false, features = [
    "test-hooks",
] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[features]
