name: "Scene Test Project"
build_binary_name: "SceneTestProject"
version: "0.1.0"
author: "Matt Szymonski"
description: "Four meshes, a themed UI layer and a fixed scene for the editor suites."

# The rendering pair is what every editor suite draws through. The reload and
# patch anchors live in the `native` test project, so this one adds no other
# module.
modules:
  pill_rendering:
    enabled: true
  pill_renderer:
    enabled: true

# The editor suites locate widgets through the editor's rect dumps and pace
# themselves on its heartbeats, and the web smoke waits for the test project's
# own per-input lines; all of them log at debug.
host:
  logging:
    targets:
      engine::editor: debug
      project: debug
