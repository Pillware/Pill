name: "Editor API Test Project"
build_binary_name: "EditorApiTestProject"
version: "0.1.0"
author: "Matt Szymonski"
description: "One path entity and the test extension, for the editor API suite."

# The test extension's runtime crate: its four `ModuleTest` entities are the
# fixture the editor API's callbacks edit, select and delete. The extension's
# `_editor` crate is loaded by the editor host on top of it, and no game build
# ever builds that one.
modules:
  - "pill_test"

# The editor API's callbacks run at the editor's frame boundary, so the suite
# needs the editor's own target at debug to read them.
logging:
  targets:
    engine::editor: debug
